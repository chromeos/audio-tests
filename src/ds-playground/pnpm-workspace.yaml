# Consumed by rules_js via npm_translate_lock. Declares which packages may run
# install lifecycle scripts, so no dependency executes code at install time
# without being listed here explicitly.
#
# husky is deliberately omitted: its install hook only wires up local git hooks,
# which is developer-machine state rather than a build input.
allowBuilds:
  core-js-bundle: true
  esbuild: true
