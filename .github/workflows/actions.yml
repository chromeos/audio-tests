name: Actions

on:
  push:
    branches: [main]
  pull_request:

# Deny by default; each job opts in to what it needs.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    # persist-credentials: false keeps the token out of .git/config, which is
    # otherwise reachable from build output and uploaded artifacts. Nothing here
    # pushes; the deploy job supplies its own token.
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      with:
        persist-credentials: false
    # Bazel provides the Node toolchain, npm dependencies and browsers, so no
    # setup-node, package-manager install or playwright install step is needed.
    # All four caches default to false and must be enabled explicitly.
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
    - name: Test
      run: bazel test //...
    - name: Build site
      run: bazel build //:site
    # Materializes //:site into out/. Writes 644/755 directly, so the deploy job
    # does not commit a tree of executables, and does not depend on the bazel-bin
    # convenience symlink.
    - name: Stage site
      run: bazel run //:stage_site
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: out
        path: out/

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: out
        path: out/

    - run: |
        cd out/
        git init -b gh-pages
        git config user.name chromeos-audio+bot
        git config user.email chromeos-audio+bot@google.com
        git add -A
        git commit -m 'build ${{ github.sha }}'
        git remote add pages https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        git push pages gh-pages --force
